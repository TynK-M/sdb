[project]
name = "sdb"
version = "0.1.0"
description = "Export seriousdb databases to common formats"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sdb = "sdb.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.81",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
